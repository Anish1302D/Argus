[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "argus"
version = "0.1.0"
description = "Evidence-grounded technology readiness assessment and debate intelligence"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pydantic>=2.10.0,<3.0.0",
    "pypdfium2>=4.30.0",
    "pdfplumber>=0.11.0",
    "rank-bm25>=0.2.2",
]

[project.optional-dependencies]
ml = [
    "torch>=2.5.0",
    "transformers>=4.48.0",
    "sentence-transformers>=3.4.0",
    "lightgbm>=4.5.0",
    "scikit-learn>=1.6.0",
    "shap>=0.46.0",
]
agent = [
    "llama-cpp-python>=0.3.0",
]
api = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "supabase>=2.13.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.0",
]
all = [
    "argus[ml,agent,api,dev]",
]

[tool.setuptools.packages.find]
where = ["packages/core/src", "packages/document_processing/src", "packages/ml_inference/src", "packages/retrieval/src", "packages/agent_orchestration/src", "packages/competition_engine/src", "apps/api/src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
    "packages/core/src",
    "packages/document_processing/src",
    "packages/ml_inference/src",
    "packages/retrieval/src",
    "packages/agent_orchestration/src",
    "packages/competition_engine/src",
    "apps/api/src",
    "apctt_submission",
    "apctt-participant-kit-0.5.0-cpu/src",
    "."
]
addopts = "-v --strict-markers"

[tool.pyright]
extraPaths = [
    "packages/core/src",
    "packages/document_processing/src",
    "packages/ml_inference/src",
    "packages/retrieval/src",
    "packages/agent_orchestration/src",
    "packages/competition_engine/src",
    "apps/api/src"
]


